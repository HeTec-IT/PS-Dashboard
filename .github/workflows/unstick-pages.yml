name: Unstick Pages
on:
  push:
    paths:
      - '.github/workflows/unstick-pages.yml'
permissions:
  pages: write
  contents: read
jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/deployments/3b90b7ffd3518d024e9cd4be1b68e2116451e5b4/cancel || echo "cancel failed (evtl. schon beendet)"
