name: TV-Preise aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preise von o2online.de holen
        run: node scripts/tv-preise.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tv-preise.json
          git diff --cached --quiet || (git commit -m "TV-Preise aktualisiert" && git push)
