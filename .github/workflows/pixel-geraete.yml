name: Pixel-Geräte aktualisieren

on:
  schedule:
    - cron: '5 11 * * *'   # 12:05 Uhr (Winterzeit), in der Sommerzeit 13:05 Uhr
  workflow_dispatch:
  push:
    paths:
      - 'scripts/pixel-geraete.mjs'
      - '.github/workflows/pixel-geraete.yml'

permissions:
  contents: write

concurrency:
  group: pixel-geraete
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser installieren
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Pixel-Geräte vom o2 Shop holen
        run: node scripts/pixel-geraete.mjs
        # Bei Problemen testweise PIXEL_DEBUG: '1' als env setzen -> Diagnose landet in pixel-debug.txt
      - name: Speichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add pixel-geraete.json
          if [ -e pixel-debug.txt ]; then git add pixel-debug.txt; else git rm -q --cached --ignore-unmatch pixel-debug.txt; fi
          git diff --cached --quiet || (git commit -m "Pixel-Geräte aktualisiert" && git pull --rebase && git push)
